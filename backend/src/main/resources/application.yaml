spring:
  application:
    name: pgp-key-manager-api

  config:
    import: optional:classpath:application-secret.yaml

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Supabase may already have V1/V2 tables created before Flyway history existed.
    baseline-on-migrate: true
    baseline-version: 2
    url: ${FLYWAY_URL:${spring.datasource.url}}
    user: ${FLYWAY_USER:${spring.datasource.username}}
    password: ${FLYWAY_PASSWORD:${spring.datasource.password}}


server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  auth0:
    issuer-uri: ${AUTH0_ISSUER_URI:}
    audience: ${AUTH0_AUDIENCE:}
  storage:
    aws:
      enabled: ${STORAGE_AWS_ENABLED:true}
      probe-object-suffix: ${STORAGE_AWS_PROBE_OBJECT_SUFFIX:.pgp-key-manager-probe/}

logging:
  level:
    root: INFO
    org.bruneel.pgpkeymanager: INFO

---
spring:
  config:
    activate:
      on-profile: dev

logging:
  level:
    org.bruneel.pgpkeymanager: DEBUG
