spring:
  application:
    name: pgp-key-manager-api

  threads:
    virtual:
      enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    root: INFO
    com.example.pgpkeymanager: INFO

---
spring:
  config:
    activate:
      on-profile: dev

logging:
  level:
    com.example.pgpkeymanager: DEBUG
