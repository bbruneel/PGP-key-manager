name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 25)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Test
        run: ./mvnw --batch-mode test

  frontend:
    name: Frontend (Node 24.16.0)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify Node and npm versions
        run: |
          node -v
          npm -v
          test "$(node -v)" = "v24.16.0"
          test "$(npm -v)" = "11.13.0"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8080

  openapi:
    name: OpenAPI (Redocly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint OpenAPI
        run: npm run docs:lint

  docker:
    name: Docker (build + smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build images
        run: docker compose -f docker/compose.yml build

      - name: Smoke test
        run: |
          docker compose -f docker/compose.yml up -d
          for i in $(seq 1 60); do
            if curl -fsS http://localhost/api/hello | grep -q '"ok"'; then
              echo "Smoke test passed"
              docker compose -f docker/compose.yml down -v
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for /api/hello"
          docker compose -f docker/compose.yml logs
          docker compose -f docker/compose.yml down -v
          exit 1
